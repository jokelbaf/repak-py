[package]
name = "repak-py"
version = "0.2.3"
edition = "2024"
license = "MIT"
publish = false

[workspace]
members = ["vendor/oodle_loader"]

[lib]
name = "_repak"
crate-type = ["cdylib"]

[dependencies]
base64 = "0.23"
hex = "0.4"
oodle_loader = { path = "vendor/oodle_loader" }
pyo3 = { version = "0.29", features = ["abi3-py310", "extension-module"] }
repak = { git = "https://git.nekolab.app/jokelbaf/repak-sp.git", features = [
    "oodle",
] }

[patch."https://git.nekolab.app/jokelbaf/repak-sp.git"]
oodle_loader = { path = "vendor/oodle_loader" }

[profile.release]
lto = "thin"
strip = true
